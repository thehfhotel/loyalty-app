# Staging docker-compose override
# Used for staging deployments with GHCR images (no source code bind mounts)
# Usage: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml -f docker-compose.staging.yml up -d
#
# This file provides staging-specific configuration:
# - Different ports from production (to run on same host)
# - Container names with _dev suffix
# - Staging-specific environment variables
# - NO source code bind mounts (uses GHCR built images)

services:
  postgres:
    container_name: loyalty_postgres_dev
    # Staging (unlike this base override's default of "no") must survive an
    # evergreen daemon/host restart unattended — see the incident on
    # 2026-08-27 where all five dev containers stayed down after two host
    # restarts until someone started them by hand. Production already sets
    # this in docker-compose.prod.yml; mirror it here for staging only.
    restart: unless-stopped
    ports:
      # Bind to localhost only — backend reaches postgres via the docker network.
      # Host port mapping exists for ad-hoc DBA access from the host (via SSH tunnel).
      - "127.0.0.1:5435:5432"  # Dev port 5435 (prod uses 5434)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    container_name: loyalty_redis_dev
    restart: unless-stopped
    ports:
      # Bind to localhost only — backend reaches redis via the docker network.
      - "127.0.0.1:6380:6379"  # Dev port 6380 (prod uses 6379)

  backend:
    container_name: loyalty_backend_dev
    restart: unless-stopped
    environment:
      RUST_ENV: staging
      NODE_ENV: staging
      PORT: ${BACKEND_PORT:-4001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      LINE_CLIENT_ID: ${LINE_CHANNEL_ID}
      LINE_CLIENT_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CALLBACK_URL: ${LINE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # Admin bootstrap allowlist (issue #348): one-time first-admin
      # provisioning. NOT part of the CI deploy payload — set it by hand in
      # the server-side .env for the bootstrap window, then remove it.
      # Empty/unset = feature off.
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      # Rust-specific logging
      RUST_LOG: ${RUST_LOG:-info}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Email Service (SMTP/IMAP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # From address for outgoing mail. Falls back to SMTP_USER when unset,
      # and must be an address the mailbox genuinely OWNS (issue #352).
      SMTP_FROM: ${SMTP_FROM:-}
      # Property mailboxes that get one short email per new booking and per
      # verified deposit (B0). Blank = off for that property; the backend
      # reads a blank as "unset" so `${VAR:-}` cannot mean "send to nobody".
      BOOKING_NOTIFY_EMAIL_HF: ${BOOKING_NOTIFY_EMAIL_HF:-}
      BOOKING_NOTIFY_EMAIL_HFVILLE: ${BOOKING_NOTIFY_EMAIL_HFVILLE:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      # Slip-image retention (F2). Days after a booking closes before the
      # slip photograph is erased from STORAGE_PATH/slips. Blank = OFF: the
      # backend reads a blank as unset (config::env_present), and there is
      # deliberately no default, because the window is the owner's decision.
      SLIP_RETENTION_DAYS: ${SLIP_RETENTION_DAYS:-}
    # No source code bind mounts - uses GHCR image with built Rust binary
    volumes:
      - backend_dev_logs:/app/logs
      - backend_dev_storage:/app/storage

  frontend:
    container_name: loyalty_frontend_dev
    restart: unless-stopped
    # NOTE: VITE_API_URL is build-time only (baked into the image during docker build).
    # NODE_ENV is not consumed by the alpine nginx serving the built SPA.
    # Neither belongs in runtime env for the GHCR frontend image.
    # No source code bind mounts - uses GHCR image with built code
    # GHCR frontend uses nginx:alpine with logs at /var/log/nginx
    volumes:
      - frontend_dev_logs:/var/log/nginx

  nginx:
    container_name: loyalty_nginx_dev
    restart: unless-stopped
    ports:
      - "5001:80"  # Dev port 5001 (prod uses 4001)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_dev_logs:/var/log/nginx

# Staging-specific volumes
volumes:
  postgres_dev_data:
  backend_dev_logs:
  backend_dev_storage:
  frontend_dev_logs:
  nginx_dev_logs:

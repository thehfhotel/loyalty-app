services:
  postgres:
    # Pinned to digest: captured from the live running container
    # (loyalty_postgres_production) via `docker inspect` on 2026-08-14,
    # not a fresh registry pull. A future bump should follow the same
    # recipe — `docker inspect <container> --format '{{.Image}}'` then
    # `docker image inspect <id> --format '{{.RepoDigests}}'` — not a
    # blind `docker pull postgres:15-alpine`, which may not match what's
    # actually been running.
    image: postgres:15-alpine@sha256:aa7b1ef595e165f0b780162e3a41edd0a7ed3ea672eb8a0f81615ba725e62bc5
    container_name: loyalty_postgres
    environment:
      # Credentials are required via env vars (no insecure defaults).
      # Local dev loads them from .env.development; CI/staging/prod inject via the deploy workflow.
      # NOTE: POSTGRES_USER/PASSWORD only initialize the role on a fresh data volume.
      # Existing volumes keep their original credentials — the env vars must match.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is owned by the backend: sqlx applies migrations from
      # backend-rust/migrations/ at startup. No init-time SQL mounts.
    # PORTS: Defined in environment-specific override files (dev/prod)
    # to prevent port conflicts when both environments run on same machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pinned to digest: captured from the live running container
    # (loyalty_redis_production) via `docker inspect` on 2026-08-14, not
    # a fresh registry pull. Bump via the same recipe as postgres above
    # (`docker inspect` -> `docker image inspect --format '{{.RepoDigests}}'`),
    # not a blind `docker pull redis:7-alpine`.
    image: redis:7-alpine@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba
    container_name: loyalty_redis
    # PORTS: Defined in environment-specific override files (dev/prod)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
      target: development
    container_name: loyalty_backend
    environment:
      # Rust backend uses RUST_ENV or NODE_ENV for environment detection
      RUST_ENV: ${RUST_ENV:-development}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-4001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://redis:6379
      # One storage root for BOTH resolvers: slip uploads write to STORAGE_PATH/slips
      # (routes/slips.rs) while the file-serving service reads UPLOAD_DIR, else
      # STORAGE_PATH, else ./uploads (services/storage.rs). With neither set the
      # backend wrote slips to /app/storage (the persistent volume) and served them
      # from /app/uploads, so every slip image was a 404 and avatars landed on
      # ephemeral container storage. Fixed 2026-09-10; keep this in every env.
      STORAGE_PATH: /app/storage
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?GOOGLE_CALLBACK_URL is required}
      LINE_CLIENT_ID: ${LINE_CHANNEL_ID:?LINE_CHANNEL_ID is required}
      LINE_CLIENT_SECRET: ${LINE_CHANNEL_SECRET:?LINE_CHANNEL_SECRET is required}
      LINE_CALLBACK_URL: ${LINE_CALLBACK_URL:?LINE_CALLBACK_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # Admin bootstrap allowlist (issue #348) — empty/unset = feature off.
      # See .env.example for semantics and the remove-after-use warning.
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      # Email configuration (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # From address for outgoing mail. Falls back to SMTP_USER when unset,
      # and must be an address the mailbox genuinely OWNS (issue #352).
      SMTP_FROM: ${SMTP_FROM:-}
      # Property mailboxes that get one short email per new booking and per
      # verified deposit (B0). Blank = off for that property; the backend
      # reads a blank as "unset" so `${VAR:-}` cannot mean "send to nobody".
      BOOKING_NOTIFY_EMAIL_HF: ${BOOKING_NOTIFY_EMAIL_HF:-}
      BOOKING_NOTIFY_EMAIL_HFVILLE: ${BOOKING_NOTIFY_EMAIL_HFVILLE:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      # SlipOK slip verification + PromptPay receiving ids (PR #399 / #402).
      # Optional; the backend treats a blank as unset (config::env_present).
      SLIPOK_API_KEY: ${SLIPOK_API_KEY:-}
      SLIPOK_BRANCH_ID: ${SLIPOK_BRANCH_ID:-}
      SLIPOK_AUTO_VERIFY: ${SLIPOK_AUTO_VERIFY:-}
      PROMPTPAY_TAX_ID: ${PROMPTPAY_TAX_ID:-}
      PROMPTPAY_HF_ID: ${PROMPTPAY_HF_ID:-}
      PROMPTPAY_HFVILLE_ID: ${PROMPTPAY_HFVILLE_ID:-}
      # Rust-specific logging
      RUST_LOG: ${RUST_LOG:-info}
    # VOLUMES: Source mounts (./backend-rust:/app) are in docker-compose.dev.yml ONLY
    # Production uses Docker image contents - no source mount needed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Command defined in override files (dev: cargo watch, prod: uses Dockerfile CMD)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loyalty_frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # VITE_API_URL is build-time only (baked into the frontend image during
      # `docker build` via build-args). It is NOT a runtime env var — the
      # served bundle already has it resolved. The dev override
      # (docker-compose.dev.yml) sets VITE_API_URL for the Vite dev server,
      # which is the only place that reads it at runtime.
    # VOLUMES: Source mounts (./frontend:/app) are in docker-compose.dev.yml ONLY
    # Production uses Docker image contents - no source mount needed
    depends_on:
      - backend
    # Command defined in override files (dev: npm run dev, prod: build & preview)

  nginx:
    # Pinned to digest: captured from the live running container
    # (loyalty_nginx_production) via `docker inspect` on 2026-08-14, not
    # a fresh registry pull. Bump via the same recipe as postgres above.
    image: nginx:alpine@sha256:052b75ab72f690f33debaa51c7e08d9b969a0447a133eb2b99cc905d9188cb2b
    container_name: loyalty_nginx
    # PORTS: Defined in environment-specific override files (dev/prod)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_logs:
  backend_storage:
  frontend_logs:
  nginx_logs:

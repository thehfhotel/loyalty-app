events {
    worker_connections 1024;
}

http {
    # MIME types configuration for proper favicon serving
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Allow file uploads up to 15MB
    client_max_body_size 15M;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4001;
    }

    # Forward websocket upgrades only when the client actually asked for one.
    # Unconditionally sending 'Connection: upgrade' on every proxied request is
    # the classic h2c-smuggling foothold.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================================================================
    # MAIN APPLICATION SERVER
    # ==========================================================================
    # NOTE: server_name is set to 'localhost' by design for Cloudflare proxy setup
    # Cloudflare proxies requests to the origin server without changing the Host header
    # Using localhost allows the application to work both:
    #   - Directly via localhost (development/testing)
    #   - Through Cloudflare tunnel (production with custom domain)
    # If you need a specific server_name, configure it via environment variable
    # templating in your deployment pipeline
    # ==========================================================================
    server {
        listen 80;
        server_name localhost;

        # Security headers (applied to all responses, including errors, via `always`)
        # CSP starts permissive enough for the SPA to render — tune if console errors fire.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none';" always;

        # Favicon specific handling
        location = /favicon.ico {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1d;
            
            # Log favicon requests for debugging
            access_log /var/log/nginx/favicon.log;
        }

        # Static assets optimization for PWA icons and other assets
        # No CORS headers — the SPA serves itself, no legitimate cross-origin use case.
        location ~* \.(png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Cache static assets for better performance
            proxy_cache_valid 200 1d;
            proxy_cache_bypass $http_cache_control;
            expires 1d;
        }

        # Manifest and service worker
        location ~* \.(json|js)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # Short cache for dynamic JSON files
            expires 1h;
        }

        # Frontend (catch-all for React Router)
        location / {
            proxy_pass http://frontend;
            # Mitigated: Connection uses the $connection_upgrade map above, so
            # "upgrade" is only sent when the client actually requested one.
            # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Storage files (avatars, uploads) served from backend
        # Use ^~ to prevent regex locations from overriding this
        location ^~ /storage {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            # REPLACE the chain instead of appending. `$proxy_add_x_forwarded_for`
            # would prepend whatever the client sent into the header, letting an
            # attacker spoof the leftmost IP. The backend's rate limiter reads
            # the actual TCP peer (ConnectInfo) anyway, but anything else that
            # consumes this header should see only the trusted upstream IP.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache uploaded files
            expires 1d;
        }

        # Deposit request links (workstream B1) — NO ACCESS LOG.
        #
        # These two paths carry a 43-character bearer token in a path
        # segment: it is the whole authentication for a payment page, and
        # `$request` in the default `combined` format would write it into
        # the access log on every page load, every 5-second poll and every
        # slip upload. Anyone with read access to the log could then open a
        # stranger's payment page and upload a slip against their booking.
        # The backend already logs the matched route rather than the raw
        # path for the same reason (`make_http_span` in src/main.rs).
        #
        # `/api/deposit/...` is the API; `/d/...` is the SPA route the
        # guest actually taps. Regex locations are matched before prefix
        # locations, so these win over `location /api` and `location /`
        # below and have to repeat their proxy settings verbatim.
        location ~ ^/api/deposit/ {
            access_log off;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/d/ {
            access_log off;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            # REPLACE the chain instead of appending — see the /storage block
            # above for the rationale. nginx is the only legitimate proxy in
            # front of the backend; any client-supplied X-Forwarded-For value
            # is dropped here so downstream consumers can't be misled.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for Vite HMR
        location /_vite_hmr {
            proxy_pass http://frontend;
            # Mitigated: Connection uses the $connection_upgrade map above, so
            # "upgrade" is only sent when the client actually requested one.
            # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
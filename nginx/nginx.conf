events {
    worker_connections 1024;
}

http {
    # MIME types configuration for proper favicon serving
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Allow file uploads up to 15MB
    client_max_body_size 15M;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4001;
    }

    # Forward websocket upgrades only when the client actually asked for one.
    # Unconditionally sending 'Connection: upgrade' on every proxied request is
    # the classic h2c-smuggling foothold.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The visitor's address, as best this hop can know it.
    #
    # Deployed topology: Cloudflare edge -> cloudflared on the host ->
    # THIS nginx -> backend. cloudflared opens its own local connection to
    # us, so `$remote_addr` is the tunnel hop and is the SAME value for
    # every visitor on earth. A per-client rate-limit budget keyed on it
    # would be one global bucket that three guests paying at once exhaust
    # between them. `CF-Connecting-IP` is the only header in this chain
    # that carries the real visitor, and Cloudflare's edge sets it itself,
    # overwriting anything the client sent.
    #
    # Falls back to `$remote_addr` when the header is absent, which is
    # every direct-to-nginx request: a local compose run, or a health
    # check from the host. There the peer IS the client.
    #
    # Note what this is NOT: `$proxy_add_x_forwarded_for`. That appends to
    # whatever the client sent, leaving the leftmost value — the one the
    # backend reads — attacker-controlled, which is how a caller mints a
    # fresh rate-limit bucket per request. Every proxy_set_header below
    # REPLACES the chain.
    map $http_cf_connecting_ip $visitor_addr {
        default $http_cf_connecting_ip;
        ''      $remote_addr;
    }

    # ==========================================================================
    # MAIN APPLICATION SERVER
    # ==========================================================================
    # NOTE: server_name is set to 'localhost' by design for Cloudflare proxy setup
    # Cloudflare proxies requests to the origin server without changing the Host header
    # Using localhost allows the application to work both:
    #   - Directly via localhost (development/testing)
    #   - Through Cloudflare tunnel (production with custom domain)
    # If you need a specific server_name, configure it via environment variable
    # templating in your deployment pipeline
    # ==========================================================================
    server {
        listen 80;
        server_name localhost;

        # Security headers (applied to all responses, including errors, via `always`)
        # CSP starts permissive enough for the SPA to render — tune if console errors fire.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none';" always;

        # Favicon specific handling
        location = /favicon.ico {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1d;
            
            # Log favicon requests for debugging
            access_log /var/log/nginx/favicon.log;
        }

        # Static assets optimization for PWA icons and other assets
        # No CORS headers — the SPA serves itself, no legitimate cross-origin use case.
        location ~* \.(png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Cache static assets for better performance
            proxy_cache_valid 200 1d;
            proxy_cache_bypass $http_cache_control;
            expires 1d;
        }

        # Manifest and service worker
        location ~* \.(json|js)$ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # Short cache for dynamic JSON files
            expires 1h;
        }

        # Frontend (catch-all for React Router)
        location / {
            proxy_pass http://frontend;
            # Mitigated: Connection uses the $connection_upgrade map above, so
            # "upgrade" is only sent when the client actually requested one.
            # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Slip images: the API stores and returns `/storage/slips/<uuid>.<ext>`
        # (routes/slips.rs) but the backend mounts the handler under
        # `/api/storage/slips/:filename` (routes/mod.rs nests storage at
        # /api/storage). Until 2026-09-10 this block forwarded the path
        # unchanged, so every slip <img> was a backend 404 — unnoticed only
        # because production had never held a slip. The URI part on proxy_pass
        # swaps the matched prefix for /api/storage/slips.
        #
        # Never cached: the admin branch of serve_slip writes the PDPA access
        # log on every view, and a browser cache would silently skip it.
        location ^~ /storage/slips/ {
            proxy_pass http://backend/api/storage/slips/;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $visitor_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires off;
            add_header Cache-Control "no-store, private" always;
        }

        # Other storage files (avatars, uploads): same prefix swap onto the
        # backend's /api/storage mount; these stay cacheable.
        location ^~ /storage/ {
            proxy_pass http://backend/api/storage/;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $visitor_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1d;
        }

        # Deposit request links (workstream B1).
        #
        # A 43-character bearer token is the whole authentication for a
        # payment page, so it is kept out of every URL: the API takes it in
        # the `X-Deposit-Token` header (`routes::deposit_links`) and the
        # guest link puts it in a fragment, `/d#<token>`, which no browser
        # ever sends to a server. There is no path-parameter form of
        # either, and there never was — no link has been issued in any
        # environment in that shape.
        #
        # `access_log off` is therefore defence in depth and nothing more:
        # the token never appears in `$request` in the first place, so the
        # default `combined` format has nothing to leak. It stays because
        # the cost is one line of log we would never read and the failure
        # it guards against — someone adding a `/api/deposit/<token>`
        # route later — is silent. The backend logs the matched route
        # rather than the raw path for the same reason (`make_http_span`
        # in src/main.rs). The SPA route `/d` needs no such block: it is
        # served by `location /` and its token lives in the fragment.
        #
        # These handlers pass the VISITOR's address, not the tunnel's.
        # Regex locations are matched before prefix locations, so this
        # wins over `location /api` below and has to repeat its proxy
        # settings verbatim.
        location ~ ^/api/deposit(/|$) {
            access_log off;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            # The visitor as Cloudflare saw them. Passed through under its
            # own name AND as the whole X-Forwarded-For chain, because the
            # backend's `resolve_client_ip` reads CF-Connecting-IP first
            # and the first XFF address second — the public deposit
            # limiters key their per-client budgets on the result, and
            # $remote_addr here is the cloudflared hop, identical for
            # every guest.
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $visitor_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            # REPLACE the chain instead of appending — see the /storage block
            # above for the rationale. Whatever the client sent is dropped;
            # what goes out is the visitor's address as Cloudflare reported
            # it, or the peer when there is no Cloudflare in front. Same
            # pair of headers as the deposit block above, so a request that
            # falls through to here (a route added under /api/deposit-
            # something, say) is not silently keyed on the tunnel hop.
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $visitor_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for Vite HMR
        location /_vite_hmr {
            proxy_pass http://frontend;
            # Mitigated: Connection uses the $connection_upgrade map above, so
            # "upgrade" is only sent when the client actually requested one.
            # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
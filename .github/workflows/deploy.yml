name: Deploy

on:
  # Triggered by CI Build & Deploy ONLY. It already contains
  # `wait-for-frontend-checks`, which polls ci-test.yml for the same SHA and
  # fails closed — so its success already implies CI Tests passed.
  #
  # Listing both workflows used to fire this workflow 2-3x per commit; whichever
  # fired first found the other still pending, set ready=false and SKIPPED the
  # deploy while the run still reported "success". Measured over 26 runs: 11
  # cancelled by queue eviction and 6 of the greens deployed nothing.
  workflow_run:
    workflows: ["CI Build & Deploy"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

# Keep the default token read-only, like ci-build-e2e.yml. `issues: write`
# lives on notify-on-failure and `packages: read` on deploy-production, at job
# level: deploy-production pipes GITHUB_TOKEN over SSH to evergreen so the
# remote shim can pull from GHCR, and a token that leaves the CI boundary must
# carry no repo-write capability.
permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: thehfhotel
  IMAGE_REPO: loyalty-app

jobs:
  # =============================================================================
  # CHECK PRECONDITIONS FOR THIS COMMIT
  #
  # Staging deploy moved into ci-build-e2e.yml (no workflow_run hop needed) —
  # this workflow gates the (now unattended) production deploy on: the build
  # succeeding, CI Tests succeeding, the trigger being a real push to main, and
  # the commit still being main's tip.
  # =============================================================================

  check-prerequisites:
    name: "Check Prerequisites"
    runs-on: ubuntu-latest
    # Only for a SUCCESSFUL build of a real push. A workflow_dispatch or re-run
    # of CI Build & Deploy skips deploy-staging (it is push-only), so without
    # this guard a manual build would ship straight to production having never
    # touched staging.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    # Generous enough to cover the ci-test.yml poll below (72 x 10s) without
    # the job being killed mid-wait, which would read as a failed deploy.
    timeout-minutes: 15
    outputs:
      should-deploy: ${{ steps.check.outputs.ready }}
      commit-sha: ${{ steps.check.outputs.sha }}

    steps:
      - name: Check all workflows passed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Checking deploy preconditions for commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Assert that THIS build actually put the commit on staging and found
          # it healthy. The `event == 'push'` job guard above stops a
          # workflow_dispatch (whose staging jobs are push-only, hence skipped)
          # from reaching production, but a partial "re-run failed jobs" can
          # still conclude `success` with the staging jobs missing. A skipped
          # job does not change a workflow's conclusion, so the trigger's
          # conclusion alone proves nothing about staging.
          RUN_ID="${{ github.event.workflow_run.id }}"
          STAGING=$(gh run view "$RUN_ID" -R "${{ github.repository }}" \
            --json jobs --jq '.jobs[] | select(.name == "Verify Staging") | .conclusion')
          echo "CI Build & Deploy run $RUN_ID -> Verify Staging: ${STAGING:-absent}"

          if [ "$STAGING" != "success" ]; then
            echo "::error::Run $RUN_ID did not deploy and verify staging for $SHA (Verify Staging=${STAGING:-absent})."
            echo "Refusing to promote an unverified commit to production."
            exit 1
          fi

          # Defence-in-depth: CI Build & Deploy's wait-for-frontend-checks job
          # already fails closed on ci-test.yml, but verify independently so
          # removing that job can never silently un-gate production.
          #
          # Poll rather than sample once (same loop as ci-build-e2e.yml's
          # wait-for-frontend-checks): a one-shot read of an in-progress run
          # yields conclusion "" and would fail a deploy that is merely early.
          # Selecting `status` too is what makes "not finished yet" (retry)
          # distinguishable from "finished badly" (abort) — `.conclusion //
          # "pending"` alone never fires, because in-flight runs return an
          # empty string, not null.
          TEST_STATUS=""
          for attempt in $(seq 1 72); do
            TEST_STATUS=$(gh run list -R "${{ github.repository }}" \
              --workflow=ci-test.yml --branch=main --commit="$SHA" \
              --json conclusion,status --jq '.[0] | "\(.status):\(.conclusion // "pending")"')
            echo "Attempt $attempt: CI Tests = ${TEST_STATUS:-no-run-yet}"

            case "$TEST_STATUS" in
              completed:success)
                break
                ;;
              completed:*)
                echo "::error::CI Tests did not succeed for $SHA (status=$TEST_STATUS)."
                echo "Refusing to deploy. Failing loudly rather than skipping, so a"
                echo "non-deploy can never be reported as a green run."
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          if [ "$TEST_STATUS" != "completed:success" ]; then
            echo "::error::Timed out waiting for CI Tests to complete for $SHA (last status=${TEST_STATUS:-no-run-yet})."
            exit 1
          fi

          # Staleness guard. `concurrency` serializes deploys by QUEUE ARRIVAL,
          # not commit recency: if an older commit's build finishes after a newer
          # one's, this workflow would roll production BACKWARDS — running older
          # code against a database that already has the newer migrations.
          TIP=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$SHA" != "$TIP" ]; then
            echo "::notice::Superseded — $SHA is no longer the tip of main ($TIP). Skipping; the newer commit's deploy covers this."
            {
              echo "## Production deploy skipped (superseded)"
              echo ""
              echo "- Triggering commit: \`$SHA\`"
              echo "- Current tip of main: \`$TIP\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Prerequisites satisfied and $SHA is the tip of main - deploying"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # DEPLOY TO PRODUCTION (unattended — the `production` environment no longer
  # has a required reviewer, so check-prerequisites above is the only gate)
  # =============================================================================

  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [check-prerequisites]
    if: needs.check-prerequisites.outputs.should-deploy == 'true'
    timeout-minutes: 10
    # Shares the `production-mutation` group with backup-production.yml so the
    # nightly pg_dump and a production deploy can never overlap. Concurrency
    # groups are repo-wide strings, so BOTH sides must name it — the backup
    # workflow alone bought nothing. Without this, a deploy that applies a
    # migration mid-dump yields a backup spanning two schema versions, which is
    # exactly the backup you would reach for after a bad migration.
    concurrency:
      group: production-mutation
      cancel-in-progress: false
    # Least privilege: GITHUB_TOKEN is handed to the remote shim on evergreen
    # (see GHCR_TOKEN below), so it gets exactly what a `docker pull` from GHCR
    # needs — plus contents:read for the sparse checkout. Nothing writable.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://loyalty.saichon.com

    steps:
      - name: Checkout config files
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.check-prerequisites.outputs.commit-sha }}
          sparse-checkout: |
            .github/actions/evergreen-ssh
            docker-compose.yml
            docker-compose.ghcr.yml
            docker-compose.prod.yml
            nginx/nginx.conf
          sparse-checkout-cone-mode: false

      - name: Set up SSH access to evergreen
        uses: ./.github/actions/evergreen-ssh
        with:
          ssh-key: ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
          host-key: ${{ secrets.EVERGREEN_HOST_KEY }}

      - name: Deploy via SSH to evergreen
        env:
          COMMIT_SHA:           ${{ needs.check-prerequisites.outputs.commit-sha }}
          GHCR_USER:            ${{ github.actor }}
          GHCR_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET:           ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET:   ${{ secrets.JWT_REFRESH_SECRET }}
          SESSION_SECRET:       ${{ secrets.SESSION_SECRET }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          POSTGRES_USER:        ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:    ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB:          ${{ secrets.POSTGRES_DB }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL:  ${{ vars.GOOGLE_CALLBACK_URL }}
          LINE_CHANNEL_ID:      ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET:  ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CALLBACK_URL:    ${{ vars.LINE_CALLBACK_URL }}
          FRONTEND_URL:         ${{ vars.FRONTEND_URL }}
          BACKEND_URL:          ${{ vars.BACKEND_URL }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          # The secret existed and was documented, but was never sent — so the
          # backend always fell back to SMTP_USER as its From address (#352).
          SMTP_FROM:            ${{ secrets.SMTP_FROM }}
          IMAP_HOST:            ${{ secrets.IMAP_HOST }}
          IMAP_PORT:            ${{ secrets.IMAP_PORT }}
          IMAP_USER:            ${{ secrets.IMAP_USER }}
          IMAP_PASS:            ${{ secrets.IMAP_PASS }}
          # SlipOK slip verification (PR #399): API key + branch id as secrets.
          # Leaving them unset keeps every slip on manual verify.
          SLIPOK_API_KEY:       ${{ secrets.SLIPOK_API_KEY }}
          SLIPOK_BRANCH_ID:     ${{ secrets.SLIPOK_BRANCH_ID }}
          # Receiving PromptPay IDs per property (repository *variables*, not
          # secrets: a tax id is printed on every receipt). The QR endpoint
          # answers "not configured" for a property whose id is unset.
          PROMPTPAY_HF_ID:      ${{ vars.PROMPTPAY_HF_ID }}
          SLIPOK_AUTO_VERIFY:      ${{ vars.SLIPOK_AUTO_VERIFY }}
          PROMPTPAY_HFVILLE_ID: ${{ vars.PROMPTPAY_HFVILLE_ID }}
          # Slip-image retention window in days (F2). A repository *variable*,
          # not a secret: a retention period is policy, not a credential.
          # Unset keeps the sweep off and no slip image is ever erased.
          SLIP_RETENTION_DAYS:  ${{ vars.SLIP_RETENTION_DAYS }}
          # Audit-log retention windows in days (F10). Repository *variables*
          # for the same reason: a retention period is policy, not a
          # credential, and the owner needs to read it back in the UI. Unset
          # keeps each prune off. Both are floored in the backend (365 days
          # for booking_audit_log, 90 for slip_access_log) and a smaller value
          # is refused at startup rather than clamped.
          AUDIT_LOG_RETENTION_DAYS:       ${{ vars.AUDIT_LOG_RETENTION_DAYS }}
          SLIP_ACCESS_LOG_RETENTION_DAYS: ${{ vars.SLIP_ACCESS_LOG_RETENTION_DAYS }}
          # Property mailboxes for the new-booking / deposit-received email
          # (B0). Repository *variables*, not secrets: a mailbox address is
          # not a secret, and a variable is readable in the UI, which is what
          # the owner needs to check who is actually being told. Unset = the
          # notification is off for that property.
          BOOKING_NOTIFY_EMAIL_HF:      ${{ vars.BOOKING_NOTIFY_EMAIL_HF }}
          BOOKING_NOTIFY_EMAIL_HFVILLE: ${{ vars.BOOKING_NOTIFY_EMAIL_HFVILLE }}
          # LINE free-plan push buckets per OA per month (C5, plan §8).
          # Repository *variables*, not secrets: a message allowance is
          # policy, and the owner needs to read it back in the UI. Unset =
          # the plan defaults (ops 50, campaign 200, reserve 50, total 300).
          LINE_PUSH_BUDGET_OPS:      ${{ vars.LINE_PUSH_BUDGET_OPS }}
          LINE_PUSH_BUDGET_CAMPAIGN: ${{ vars.LINE_PUSH_BUDGET_CAMPAIGN }}
          LINE_PUSH_BUDGET_RESERVE:  ${{ vars.LINE_PUSH_BUDGET_RESERVE }}
          LINE_PUSH_BUDGET_TOTAL:    ${{ vars.LINE_PUSH_BUDGET_TOTAL }}
          # SlipOK degradation tracking (A4). Repository *variables*: a
          # monthly allowance and two alert-tuning numbers are policy, not
          # credentials, and the owner has to be able to read them back.
          # SLIPOK_MONTHLY_QUOTA is deliberately unset until the owner
          # records the plan's real number (A3) — unset means the 80 %
          # warning never fires, which is better than 80 % of a guess.
          # The other two fall back to the backend defaults (3 consecutive
          # failures, 60-minute cooldown) when unset.
          SLIPOK_MONTHLY_QUOTA:               ${{ vars.SLIPOK_MONTHLY_QUOTA }}
          SLIPOK_DEGRADE_FAILURE_THRESHOLD:   ${{ vars.SLIPOK_DEGRADE_FAILURE_THRESHOLD }}
          SLIPOK_DEGRADE_ALERT_COOLDOWN_MINS: ${{ vars.SLIPOK_DEGRADE_ALERT_COOLDOWN_MINS }}
          # PMS booking channel (B4b, ADR-0003). The base URL is a
          # repository VARIABLE: it is not a secret, it is the one value the
          # owner needs to read back in the UI to see whether the channel is
          # pointed anywhere, and blanking it is the rollback. The two tokens
          # are SECRETS — they are bearer credentials, one per direction.
          # Unset on any of the three = that direction stays dark.
          PMS_BASE_URL:          ${{ vars.PMS_BASE_URL }}
          PMS_CHANNEL_TOKEN:     ${{ secrets.PMS_CHANNEL_TOKEN }}
          LOYALTY_SERVICE_TOKEN: ${{ secrets.LOYALTY_SERVICE_TOKEN }}
        run: |
          set -euo pipefail

          # A `${{ secrets.X }}` that does not exist renders as an empty string
          # and the env var is still SET, so `set -u` never trips on it. Without
          # this guard a deleted/renamed/rotated secret ships a well-formed
          # payload carrying JWT_SECRET="" and the shim writes an empty signing
          # key into production — green run, broken auth. Fail before touching
          # the host. SMTP/IMAP are deliberately absent: they are optional and
          # use `${VAR:-}` defaults below.
          for v in JWT_SECRET JWT_REFRESH_SECRET SESSION_SECRET DATABASE_URL \
                   POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
                   GHCR_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Required secret $v is empty or unset — aborting production deploy."
              exit 1
            fi
          done

          tar -czf /tmp/deploy.tar.gz \
            docker-compose.yml docker-compose.ghcr.yml docker-compose.prod.yml \
            nginx/nginx.conf

          # NOTE: the jq program below is a single-quoted shell string. Never put
          # comments inside it (an apostrophe in a comment ends the quote and the
          # step dies with a shell syntax error, 2026-09-10 09:56Z). Optional keys
          # (SLIPOK_*, PROMPTPAY_*_ID, BOOKING_NOTIFY_EMAIL_*, SLIP_RETENTION_DAYS,
          # AUDIT_LOG_RETENTION_DAYS, SLIP_ACCESS_LOG_RETENTION_DAYS,
          # LINE_PUSH_BUDGET_*, PMS_BASE_URL, PMS_CHANNEL_TOKEN,
          # LOYALTY_SERVICE_TOKEN)
          # are merged only when non-empty: the backend reads an empty value as
          # set, which would mint a QR with no receiving id, call SlipOK with no
          # key, mail nobody, run a retention sweep on a window nobody chose, or
          # hand an unparseable base URL to a validator that refuses to boot.
          jq -n \
            --arg commit_sha           "$COMMIT_SHA" \
            --arg deploy_payload_b64   "$(base64 -w0 < /tmp/deploy.tar.gz)" \
            --arg ghcr_user            "$GHCR_USER" \
            --arg ghcr_token           "$GHCR_TOKEN" \
            --arg JWT_SECRET           "$JWT_SECRET" \
            --arg JWT_REFRESH_SECRET   "$JWT_REFRESH_SECRET" \
            --arg SESSION_SECRET       "$SESSION_SECRET" \
            --arg DATABASE_URL         "$DATABASE_URL" \
            --arg POSTGRES_USER        "$POSTGRES_USER" \
            --arg POSTGRES_PASSWORD    "$POSTGRES_PASSWORD" \
            --arg POSTGRES_DB          "$POSTGRES_DB" \
            --arg GOOGLE_CLIENT_ID     "$GOOGLE_CLIENT_ID" \
            --arg GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET" \
            --arg GOOGLE_CALLBACK_URL  "$GOOGLE_CALLBACK_URL" \
            --arg LINE_CHANNEL_ID      "$LINE_CHANNEL_ID" \
            --arg LINE_CHANNEL_SECRET  "$LINE_CHANNEL_SECRET" \
            --arg LINE_CALLBACK_URL    "$LINE_CALLBACK_URL" \
            --arg FRONTEND_URL         "$FRONTEND_URL" \
            --arg BACKEND_URL          "$BACKEND_URL" \
            --arg SMTP_HOST            "${SMTP_HOST:-}" \
            --arg SMTP_PORT            "${SMTP_PORT:-587}" \
            --arg SMTP_USER            "${SMTP_USER:-}" \
            --arg SMTP_PASS            "${SMTP_PASS:-}" \
            --arg SMTP_FROM            "${SMTP_FROM:-}" \
            --arg IMAP_HOST            "${IMAP_HOST:-}" \
            --arg IMAP_PORT            "${IMAP_PORT:-993}" \
            --arg IMAP_USER            "${IMAP_USER:-}" \
            --arg IMAP_PASS            "${IMAP_PASS:-}" \
            --arg SLIPOK_API_KEY       "${SLIPOK_API_KEY:-}" \
            --arg SLIPOK_BRANCH_ID     "${SLIPOK_BRANCH_ID:-}" \
            --arg PROMPTPAY_HF_ID      "${PROMPTPAY_HF_ID:-}" \
            --arg SLIPOK_AUTO_VERIFY      "${SLIPOK_AUTO_VERIFY:-}" \
            --arg PROMPTPAY_HFVILLE_ID "${PROMPTPAY_HFVILLE_ID:-}" \
            --arg BOOKING_NOTIFY_EMAIL_HF      "${BOOKING_NOTIFY_EMAIL_HF:-}" \
            --arg BOOKING_NOTIFY_EMAIL_HFVILLE "${BOOKING_NOTIFY_EMAIL_HFVILLE:-}" \
            --arg SLIP_RETENTION_DAYS          "${SLIP_RETENTION_DAYS:-}" \
            --arg AUDIT_LOG_RETENTION_DAYS       "${AUDIT_LOG_RETENTION_DAYS:-}" \
            --arg SLIP_ACCESS_LOG_RETENTION_DAYS "${SLIP_ACCESS_LOG_RETENTION_DAYS:-}" \
            --arg LINE_PUSH_BUDGET_OPS      "${LINE_PUSH_BUDGET_OPS:-}" \
            --arg LINE_PUSH_BUDGET_CAMPAIGN "${LINE_PUSH_BUDGET_CAMPAIGN:-}" \
            --arg LINE_PUSH_BUDGET_RESERVE  "${LINE_PUSH_BUDGET_RESERVE:-}" \
            --arg LINE_PUSH_BUDGET_TOTAL    "${LINE_PUSH_BUDGET_TOTAL:-}" \
            --arg SLIPOK_MONTHLY_QUOTA               "${SLIPOK_MONTHLY_QUOTA:-}" \
            --arg SLIPOK_DEGRADE_FAILURE_THRESHOLD   "${SLIPOK_DEGRADE_FAILURE_THRESHOLD:-}" \
            --arg SLIPOK_DEGRADE_ALERT_COOLDOWN_MINS "${SLIPOK_DEGRADE_ALERT_COOLDOWN_MINS:-}" \
            --arg PMS_BASE_URL          "${PMS_BASE_URL:-}" \
            --arg PMS_CHANNEL_TOKEN     "${PMS_CHANNEL_TOKEN:-}" \
            --arg LOYALTY_SERVICE_TOKEN "${LOYALTY_SERVICE_TOKEN:-}" \
            '{
              commit_sha: $commit_sha,
              deploy_payload_b64: $deploy_payload_b64,
              ghcr: { user: $ghcr_user, token: $ghcr_token },
              env: {
                RUST_ENV:             "production",
                NODE_ENV:             "production",
                RUST_LOG:             "info",
                LOG_LEVEL:            "info",
                JWT_SECRET:           $JWT_SECRET,
                JWT_REFRESH_SECRET:   $JWT_REFRESH_SECRET,
                SESSION_SECRET:       $SESSION_SECRET,
                POSTGRES_USER:        $POSTGRES_USER,
                POSTGRES_PASSWORD:    $POSTGRES_PASSWORD,
                POSTGRES_DB:          $POSTGRES_DB,
                DATABASE_URL:         $DATABASE_URL,
                REDIS_URL:            "redis://redis:6379",
                FRONTEND_URL:         $FRONTEND_URL,
                BACKEND_URL:          $BACKEND_URL,
                GOOGLE_CLIENT_ID:     $GOOGLE_CLIENT_ID,
                GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET,
                GOOGLE_CALLBACK_URL:  $GOOGLE_CALLBACK_URL,
                LINE_CHANNEL_ID:      $LINE_CHANNEL_ID,
                LINE_CHANNEL_SECRET:  $LINE_CHANNEL_SECRET,
                LINE_CALLBACK_URL:    $LINE_CALLBACK_URL,
                SMTP_HOST:            $SMTP_HOST,
                SMTP_PORT:            $SMTP_PORT,
                SMTP_USER:            $SMTP_USER,
                SMTP_PASS:            $SMTP_PASS,
                SMTP_FROM:            $SMTP_FROM,
                IMAP_HOST:            $IMAP_HOST,
                IMAP_PORT:            $IMAP_PORT,
                IMAP_USER:            $IMAP_USER,
                IMAP_PASS:            $IMAP_PASS
              }
            }
            | .env += ({ SLIPOK_API_KEY: $SLIPOK_API_KEY, SLIPOK_BRANCH_ID: $SLIPOK_BRANCH_ID,
                         PROMPTPAY_HF_ID: $PROMPTPAY_HF_ID, PROMPTPAY_HFVILLE_ID: $PROMPTPAY_HFVILLE_ID,
                         BOOKING_NOTIFY_EMAIL_HF: $BOOKING_NOTIFY_EMAIL_HF,
                         BOOKING_NOTIFY_EMAIL_HFVILLE: $BOOKING_NOTIFY_EMAIL_HFVILLE,
                         SLIPOK_AUTO_VERIFY: $SLIPOK_AUTO_VERIFY,
                         SLIP_RETENTION_DAYS: $SLIP_RETENTION_DAYS,
                         AUDIT_LOG_RETENTION_DAYS: $AUDIT_LOG_RETENTION_DAYS,
                         SLIP_ACCESS_LOG_RETENTION_DAYS: $SLIP_ACCESS_LOG_RETENTION_DAYS,
                         LINE_PUSH_BUDGET_OPS: $LINE_PUSH_BUDGET_OPS,
                         LINE_PUSH_BUDGET_CAMPAIGN: $LINE_PUSH_BUDGET_CAMPAIGN,
                         LINE_PUSH_BUDGET_RESERVE: $LINE_PUSH_BUDGET_RESERVE,
                         LINE_PUSH_BUDGET_TOTAL: $LINE_PUSH_BUDGET_TOTAL,
                         SLIPOK_MONTHLY_QUOTA: $SLIPOK_MONTHLY_QUOTA,
                         SLIPOK_DEGRADE_FAILURE_THRESHOLD: $SLIPOK_DEGRADE_FAILURE_THRESHOLD,
                         SLIPOK_DEGRADE_ALERT_COOLDOWN_MINS: $SLIPOK_DEGRADE_ALERT_COOLDOWN_MINS,
                         PMS_BASE_URL: $PMS_BASE_URL,
                         PMS_CHANNEL_TOKEN: $PMS_CHANNEL_TOKEN,
                         LOYALTY_SERVICE_TOKEN: $LOYALTY_SERVICE_TOKEN }
                       | with_entries(select(.value != "")))' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              deploy@evergreen.thehfhotel.org

      # The SSH pipeline above exits 0 as soon as the remote shim has STARTED
      # the containers — not when the app is serving. Without this, a release
      # that crash-loops on a bad migration, a missing env var, or a panic at
      # startup reports a fully green deploy. Staging has had this check since
      # day one (ci-build-e2e.yml verify-staging); production had none, which
      # matters more now that nobody approves the deploy.
      - name: Verify production is serving
        env:
          PROD_HEALTH_URL: https://loyalty.saichon.com/api/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$PROD_HEALTH_URL" >/dev/null; then
              echo "Production healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Production /api/health not responding 90s after deploy"
          exit 1

      # A 200 proves only that *something* answers — `version` is
      # CARGO_PKG_VERSION, identical on every commit. `revision` is the commit
      # SHA baked into the image at build time (ARG/ENV GIT_SHA), so it proves
      # WHICH BUILD is serving. That matters most here: production deploys are
      # unattended, and the deploy host's shim cannot be reached for a
      # `docker inspect` (the deploy key carries a forced command). Issue #345.
      #
      # PHASED ROLLOUT — three outcomes, same contract as verify-staging:
      #   revision == deploying SHA   -> pass
      #   revision absent / "unknown" -> WARN but pass (image predates the
      #                                  bake, or this is a rollback to one;
      #                                  a rollback must not go red for it)
      #   revision == a DIFFERENT SHA -> FAIL (no-op / partial / overtaken)
      - name: Verify production is running this commit
        env:
          PROD_HEALTH_URL: https://loyalty.saichon.com/api/health
          EXPECTED_SHA: ${{ needs.check-prerequisites.outputs.commit-sha }}
        run: |
          set -uo pipefail

          # Poll until it MATCHES rather than classifying the first sample:
          # for a few seconds after a deploy the outgoing container can still
          # answer through nginx while the new one starts, and reading that as
          # "serving a different commit" would fail a perfectly good deploy.
          #
          # Deliberately NOT `curl -f`: /api/health answers 503 when a
          # dependency is degraded and -f throws away the body, which is the
          # only place `revision` lives.
          REVISION=""
          for attempt in $(seq 1 20); do
            BODY=$(curl -sS --max-time 5 "$PROD_HEALTH_URL" 2>/dev/null || true)
            REVISION=$(printf '%s' "$BODY" | jq -r '.revision // empty' 2>/dev/null || true)
            if [ "$REVISION" = "$EXPECTED_SHA" ]; then
              echo "Production is running $EXPECTED_SHA (after ${attempt} attempt(s))."
              exit 0
            fi
            sleep 3
          done

          echo "expected revision:  $EXPECTED_SHA"
          echo "last seen revision: ${REVISION:-<absent>}"

          if [ -z "$REVISION" ] || [ "$REVISION" = "unknown" ]; then
            echo "::warning::Production /api/health reports no revision (${REVISION:-absent}). The running image predates the GIT_SHA bake, or this is a rollback to such an image. Cannot prove the deploy landed — NOT failing for it."
            {
              echo "## Production revision unavailable"
              echo ""
              echo "- Expected: \`$EXPECTED_SHA\`"
              echo "- Reported: \`${REVISION:-absent}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Production is serving a DIFFERENT commit. Expected $EXPECTED_SHA, got $REVISION. The deploy was a no-op, partial, or has been overtaken."
          exit 1

      - name: Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ needs.check-prerequisites.outputs.commit-sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${{ needs.check-prerequisites.outputs.commit-sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://loyalty.saichon.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: Rust (loyalty-backend)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # NOTIFY ON PRODUCTION DEPLOY FAILURE
  #
  # Files (or comments on) a GitHub issue if the prod deploy job fails so the
  # operator who approved the deploy isn't the only person with the failure
  # signal. Slack / email channels can be added later by adding a step here
  # that consumes an `OPS_ALERT_SLACK_WEBHOOK` secret — no other change.
  # =============================================================================

  notify-on-failure:
    name: "Notify on production deploy failure"
    runs-on: ubuntu-latest
    # check-prerequisites must be in `needs` — the body reads its
    # commit-sha output, which actionlint flagged as undefined (the issue was
    # being filed with an empty commit). `failure() || cancelled()` because a
    # deploy cancelled mid-SSH leaves production just as undefined as a failed
    # one, and cancellation is the outcome that actually happens here.
    needs: [check-prerequisites, deploy-production]
    if: failure() || cancelled()
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update prod-deploy-failure issue
        env:
          GH_TOKEN:   ${{ github.token }}
          RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ needs.check-prerequisites.outputs.commit-sha }}
        run: |
          set -euo pipefail
          TITLE="Production deploy failed"
          EXISTING=$(gh issue list -R "${{ github.repository }}" \
            --search "$TITLE in:title is:open" \
            --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          The production deploy job failed or was cancelled.

          - Run: $RUN_URL
          - Commit: \`$COMMIT_SHA\`

          Production is now in an undefined state. See
          \`docs/rollback-runbook.md\` for the redeploy-previous-SHA path.
          EOF
          )

          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" -R "${{ github.repository }}" --body "$BODY"
          else
            gh issue create -R "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY"
          fi

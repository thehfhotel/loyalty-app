name: CodeQL

# Static analysis / code scanning via CodeQL (advanced setup, committed to the
# repo so language and version changes are reviewable). This replaces the
# previously GitHub-managed *default* setup, which went stale (last scan
# 2026-02-06, javascript-typescript only) and is now reported as
# `not-configured`. Advanced setup also lets us cover the GitHub Actions
# workflows and the Rust backend, which default setup was not analysing.
#
# Languages:
#   - actions               : scans .github/workflows/* for script-injection
#                             and supply-chain misconfigurations
#   - javascript-typescript : the React/TS frontend (+ root tooling)
#   - rust                  : the Axum backend
#
# All languages use build-mode: none — CodeQL extracts from source and does not
# need a project build, which keeps the run fast and avoids coupling code
# scanning to the (heavier) compile pipeline in ci-build-e2e.yml.

on:
  # paths-ignore: CodeQL runs a 3-language matrix on every PR, rebase and
  # squash-merge — measured as the 4th most expensive workflow in the repo
  # (~47 min over 22 runs) despite analysing nothing new on a docs-only change.
  # The weekly cron below still gives full unconditional coverage.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '23 4 * * 1'  # weekly, Monday 04:23 UTC

concurrency:
  # PR runs are keyed by ref so a rebase/force-push supersedes its own stale
  # analysis. push and schedule runs are keyed by COMMIT (and by event, so the
  # Monday cron never shares a slot with a merge): `github.ref` is
  # `refs/heads/main` for both, and a static group evicts the *pending* run when
  # a third trigger arrives even with cancel-in-progress: false — which is how
  # commit 6fc61ddd ended up with no code-scanning analysis at all. Per-commit
  # groups mean main and cron analyses always complete.
  group: codeql-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only a superseded PR run is safe to cancel; a cancelled main/cron run leaves
  # that commit unanalysed with no red signal to say so.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for the workflow; the analyze job below elevates only
# to what CodeQL needs (security-events: write). Keeping an explicit top-level
# block also satisfies CodeQL's own actions/missing-workflow-permissions query.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # build-mode: none means no compilation, so the slowest observed leg is ~2m
    # (rust). 20 min is ~9x that — ample for a cold CodeQL bundle download —
    # while capping a hung extractor at a fifth of an hour instead of the 2
    # runner-hours the previous 120 allowed, on a workflow that fires ~25x/day.
    timeout-minutes: 20

    permissions:
      security-events: write   # upload SARIF code-scanning results
      packages: read           # codeql-action may pull the CodeQL bundle from GHCR
      actions: read            # read workflow run metadata (needed for `actions` analysis)
      contents: read

    strategy:
      fail-fast: false         # one language failing must not cancel the others
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"

# Trivy Container Security Scanner
# Scans Docker images for vulnerabilities in OS packages and dependencies.
#
# Image scans run AFTER "CI Build & Deploy" succeeds, reusing the GHCR images it
# pushed (~30s pull) instead of rebuilding from Dockerfiles (~6 minutes).
#
# The filesystem scan runs in two modes:
#   * on pull_request  — BLOCKING table scan (exit-code 1) so a dependency with
#     a fixable CRITICAL/HIGH CVE cannot merge. `main` has no branch protection
#     and production deploys unattended, so post-merge is too late for the
#     first signal.
#   * after CI Build & Deploy / weekly cron — SARIF upload to code scanning.

name: Trivy Container Scan

on:
  # Image scans need a published GHCR image, so they hang off the build.
  workflow_run:
    workflows: ["CI Build & Deploy"]
    types: [completed]
    branches: [main]
  # The FILESYSTEM scan reads source, not images, so it runs directly on the
  # commit. That keeps its checkout on the default ref for the event — no
  # `ref: workflow_run.head_sha`, which is what made this an untrusted-code
  # checkout in a job holding `security-events: write` (Scorecard flagged it
  # Critical, and correctly: the guards made it safe in practice but the
  # pattern remained).
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '28 5 * * 6'  # Weekly on Saturday

concurrency:
  # Key on the commit under scan so runs for different commits never evict each
  # other: a static group keeps only ONE pending run and cancels the older one,
  # which is where this repo's unexplained "cancelled" runs come from. PR runs
  # key on the ref instead, so a new push supersedes its own in-flight scan.
  group: trivy-${{ github.event_name == 'pull_request' && github.ref || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: thehfhotel
  IMAGE_REPO: loyalty-app

jobs:
  scan-backend:
    # Run only where a published GHCR image exists: after a SUCCESSFUL
    # "CI Build & Deploy", or on the weekly cron (which scans :latest).
    # Never on pull_request — no image is pushed for a PR SHA, so the job
    # would only fail on `docker pull`.
    # The `event == 'push'` + same-repository checks are the real trust
    # boundary for the `ref:` checkout below, NOT the `branches: [main]`
    # trigger filter: that filter matches `workflow_run.head_branch`, which
    # for a fork pull request is the branch name *inside the fork* — a fork
    # whose default branch is `main` passes it. ci-build-e2e.yml does run on
    # `pull_request`, so such a workflow_run exists. Without these two
    # conditions this job would check out untrusted fork code while holding
    # `security-events: write` (Scorecard: Dangerous-Workflow).
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    name: Scan Backend Image
    runs-on: ubuntu-latest
    # A hung `docker pull` or a stalled Trivy DB fetch would otherwise run to
    # GitHub's 6h default before failing.
    timeout-minutes: 20
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve backend image reference
        id: image
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="latest"
          else
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/backend:${TAG}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Scanning backend image: ${REF}"

      - name: Pull backend image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

  scan-frontend:
    # Same gate as scan-backend: image-bearing events only.
    # The `event == 'push'` + same-repository checks are the real trust
    # boundary for the `ref:` checkout below, NOT the `branches: [main]`
    # trigger filter: that filter matches `workflow_run.head_branch`, which
    # for a fork pull request is the branch name *inside the fork* — a fork
    # whose default branch is `main` passes it. ci-build-e2e.yml does run on
    # `pull_request`, so such a workflow_run exists. Without these two
    # conditions this job would check out untrusted fork code while holding
    # `security-events: write` (Scorecard: Dangerous-Workflow).
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'schedule'
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve frontend image reference
        id: image
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="latest"
          else
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/frontend:${TAG}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Scanning frontend image: ${REF}"

      - name: Pull frontend image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

  scan-filesystem:
    # Runs on push/pull_request/schedule — never on workflow_run. It scans the
    # source tree, so it does not need to wait for an image build, and driving
    # it directly off the commit means the SARIF is attributed to the commit
    # actually scanned instead of whatever main happened to be at.
    if: github.event_name != 'workflow_run'
    # The workflow default (`contents: read`) is not enough for the SARIF
    # upload below: github/codeql-action needs `security-events: write` for the
    # code-scanning API, and `actions: read` to read the run it is attributing
    # results to. Without this block the upload fails "Resource not accessible
    # by integration" on every push to main. No `packages: read` — unlike the
    # image jobs, this one never touches GHCR.
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      # PR path — a real blocking check, not a report. No SARIF upload here:
      # Dependabot-actored runs get a read-only GITHUB_TOKEN, which would fail
      # the upload and paint every Dependabot PR red for an unrelated reason
      # (the same trap semgrep.yml documents).
      - name: Run Trivy filesystem scanner (blocking)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          # Only block on CVEs that have a fix available; an unfixable upstream
          # advisory must not wedge every PR in the repo.
          ignore-unfixed: true
          # Vulnerabilities only. The default `vuln,secret` set would match the
          # RSA PEM test fixtures in backend-rust (cf_access.rs /
          # cf_access_test.rs) as HIGH secrets and fail every PR on day one.
          # Secret findings still reach code scanning via the SARIF path below.
          scanners: 'vuln'
          exit-code: '1'

      - name: Run Trivy filesystem scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

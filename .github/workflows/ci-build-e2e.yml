name: CI Build & Deploy

on:
  push:
    branches: [main]
    # Workflow- or docs-only changes don't alter the built backend/frontend
    # images, so skip the build -> staging -> production pipeline for them and
    # avoid a needless prod redeploy + approval. paths-ignore only skips a push
    # when EVERY changed file matches, so any code change still deploys.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  # Cancel superseded PR runs, but NEVER a main run: deploy-staging SSHes a
  # deploy payload to evergreen from inside this workflow, so cancelling mid-run
  # can truncate the SSH channel while the remote shim is still recreating
  # containers — leaving staging on an older commit with no failure signal.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Keep the default token read-only; the two jobs that write (GHCR push,
# staging-failure issue) scope their own permissions at job level.
permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24'
  RUST_VERSION: '1.93'
  REGISTRY: ghcr.io
  IMAGE_OWNER: thehfhotel
  IMAGE_REPO: loyalty-app
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # =============================================================================
  # LINT BACKEND (Rust) - fail-fast fmt + clippy on bare ubuntu, separate cache
  # =============================================================================

  lint-backend:
    name: "Lint Backend (Rust)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (toolchain set via with:)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Cache Rust dependencies (lint)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "backend-rust -> target"
          cache-on-failure: true
          prefix-key: "v0-rust-lint"

      - name: Check formatting
        working-directory: ./backend-rust
        run: cargo fmt --all -- --check

      - name: Run clippy (lints)
        working-directory: ./backend-rust
        run: cargo clippy --all-targets --all-features -- -D warnings

  # =============================================================================
  # BACKEND TESTS (Rust) — split into two parallel jobs
  #
  # `test-backend-unit` runs the DB-free unit/bin tests on bare ubuntu with a
  # dedicated rust-cache prefix. It typically finishes in <1m, well under the
  # release build, so it stays off the critical path entirely.
  #
  # `test-backend-integration` keeps the rust:1.93-bookworm container plus
  # Postgres + Redis services and runs only the integration suite
  # (`cargo nextest run --test '*'`). It shares the `v0-rust-container` cache
  # prefix with `build-backend-release`, so both jobs reuse the same `target/`
  # artifacts — which is also why the unit job can't share that prefix: native
  # ubuntu glibc and the bookworm container produce incompatible `target/`
  # layouts.
  #
  # `regression-api` and `deploy-staging` gate on BOTH test jobs so we never
  # burn regression/deploy time on a red backend.
  # =============================================================================

  test-backend-unit:
    name: "Test Backend Unit (Rust)"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (toolchain set via with:)
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Cache Rust dependencies (unit)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "backend-rust -> target"
          cache-on-failure: true
          # Separate prefix from `v0-rust-container`: this job runs on bare
          # ubuntu (glibc 2.39) while integration + release builds run inside
          # rust:1.93-bookworm (glibc 2.36). Sharing the cache between them
          # would surface as link-time / runtime ABI failures.
          prefix-key: "v0-rust-unit"

      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # `taiki-e/install-action@nextest` installs a single binary;
          # `cargo nextest ...` is dispatched through `cargo-nextest`.
          # On bare ubuntu, dtolnay/rust-toolchain installs cargo under
          # ~/.cargo, so cargo-installed binaries land there too.
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ env.RUST_VERSION }}-${{ runner.os }}-native

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        # Pinned to the released `v2` SHA, not the moving `nextest` alias tag:
        # Dependabot resolves a SHA pin's version from the trailing comment, so
        # "# nextest tag" meant this pin could never receive security updates.
        # The alias only presets `tool: nextest`, which is set explicitly below.
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: nextest

      - name: Run unit tests
        working-directory: ./backend-rust
        run: cargo nextest run --lib --bins
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  test-backend-integration:
    name: "Test Backend Integration (Rust)"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    timeout-minutes: 30
    container:
      image: rust:1.93-bookworm

    defaults:
      run:
        shell: bash

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loyalty_test
          POSTGRES_PASSWORD: loyalty_test_pass
          POSTGRES_DB: loyalty_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://loyalty_test:loyalty_test_pass@postgres:5432/loyalty_test_db
      TEST_DATABASE_URL: postgresql://loyalty_test:loyalty_test_pass@postgres:5432/loyalty_test_db
      TEST_REDIS_URL: redis://redis:6379
      PGPASSWORD: loyalty_test_pass

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libpq-dev postgresql-client

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "backend-rust -> target"
          cache-on-failure: true
          prefix-key: "v0-rust-container"

      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # In the rust:1.93-bookworm container, cargo lives at
          # /usr/local/cargo, so cargo-installed binaries land in
          # /usr/local/cargo/bin. Distinct key from the unit-job cache
          # because the container glibc (2.36) differs from native
          # ubuntu (2.39) and the binary is glibc-linked.
          path: /usr/local/cargo/bin/cargo-nextest
          key: cargo-nextest-${{ env.RUST_VERSION }}-${{ runner.os }}-container

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        # Pinned to the released `v2` SHA, not the moving `nextest` alias tag:
        # Dependabot resolves a SHA pin's version from the trailing comment, so
        # "# nextest tag" meant this pin could never receive security updates.
        # The alias only presets `tool: nextest`, which is set explicitly below.
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: nextest

      - name: Grant CREATEDB for per-test database isolation
        run: |
          psql -h postgres -p 5432 -U loyalty_test -d loyalty_test_db \
            -c "ALTER USER loyalty_test CREATEDB;"

      - name: Run database migrations
        run: |
          set -euo pipefail
          for f in backend-rust/migrations/*.sql; do
            echo "Applying $f"
            psql -h postgres -p 5432 -U loyalty_test -d loyalty_test_db \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify database schema
        run: |
          TABLE_COUNT=$(psql -h postgres -p 5432 -U loyalty_test -d loyalty_test_db -t -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")
          TABLE_COUNT=$(echo "$TABLE_COUNT" | tr -d ' ')
          echo "Tables created: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt 25 ]; then
            echo "::error::Expected 25+ tables, found $TABLE_COUNT. Migration may have failed."
            psql -h postgres -p 5432 -U loyalty_test -d loyalty_test_db -c \
              "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' ORDER BY table_name;"
            exit 1
          fi

          FUNC_COUNT=$(psql -h postgres -p 5432 -U loyalty_test -d loyalty_test_db -t -c \
            "SELECT count(*) FROM information_schema.routines WHERE routine_schema = 'public' AND routine_type = 'FUNCTION';")
          FUNC_COUNT=$(echo "$FUNC_COUNT" | tr -d ' ')
          echo "Stored procedures/functions: $FUNC_COUNT"
          if [ "$FUNC_COUNT" -lt 5 ]; then
            echo "::error::Expected 5+ stored procedures, found $FUNC_COUNT."
            exit 1
          fi

          echo "Database schema verification passed"

      - name: Seed test data
        run: |
          psql -h postgres -p 5432 -U loyalty_test -d loyalty_test_db -c "
            INSERT INTO tiers (name, min_points, min_nights, benefits, color, sort_order, is_active)
            VALUES
              ('Bronze', 0, 0, '{\"discount\": 0}', '#CD7F32', 1, true),
              ('Silver', 0, 1, '{\"discount\": 5}', '#C0C0C0', 2, true),
              ('Gold', 0, 10, '{\"discount\": 10}', '#FFD700', 3, true),
              ('Platinum', 0, 20, '{\"discount\": 15}', '#E5E4E2', 4, true)
            ON CONFLICT (name) DO NOTHING;

            INSERT INTO membership_id_sequence (id, current_user_count)
            VALUES (1, 0)
            ON CONFLICT (id) DO NOTHING;
          "
          echo "Test data seeded successfully"

      - name: Install sqlx-cli
        # Download a prebuilt sqlx-cli binary instead of `cargo install` from
        # source. The from-source install is slow and flaky (transient
        # crates.io / network failures during the dependency compile), and it
        # recompiles on every Rust-version bump because the toolchain change
        # invalidates the build cache. taiki-e/install-action fetches a
        # prebuilt binary (same approach used by cargo-audit.yml) — fast and
        # reliable, and it provides both `sqlx` and `cargo-sqlx`.
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: sqlx-cli

      - name: Verify SQLx query cache
        working-directory: ./backend-rust
        run: cargo sqlx prepare --check

      - name: Run integration tests
        working-directory: ./backend-rust
        run: cargo nextest run --test '*'
        env:
          RUST_BACKTRACE: short
          RUST_LOG: warn
          JWT_SECRET: test-jwt-secret-key-for-testing-only-minimum-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-testing-only-minimum-32-chars
          SESSION_SECRET: test-session-secret-key-for-testing-only-minimum-32-chars
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GOOGLE_CALLBACK_URL: http://localhost:4001/api/oauth/google/callback
          LINE_CLIENT_ID: test-line-channel-id
          LINE_CLIENT_SECRET: test-line-channel-secret
          LINE_CALLBACK_URL: http://localhost:4001/api/oauth/line/callback
          FRONTEND_URL: http://localhost:3000

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  build-backend-release:
    name: "Build Backend Release"
    runs-on: ubuntu-latest
    # Deliberately NO `needs: [lint-backend]`. Nothing in this job consumes
    # clippy/rustfmt output, so the edge was pure fail-fast — and it charged the
    # deploy critical path lint's entire wall-clock on every GREEN run (measured
    # 4m29s on run 30143612958, 66s on 30166253220). Starting the release build
    # at t=0 removes that from every good push.
    #
    # It does NOT weaken the gate: lint-backend is still its own required
    # signal, and everything downstream that can ship — `promote-latest` and
    # `deploy-staging` — gates on the two test jobs, which keep the lint edge.
    # So a clippy failure still turns the run red and still blocks the deploy;
    # the only cost is building an image nobody references on an already-red push.
    timeout-minutes: 25
    container:
      image: rust:1.93-bookworm

    defaults:
      run:
        shell: bash

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libpq-dev

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "backend-rust -> target"
          cache-on-failure: true
          prefix-key: "v0-rust-container"

      # `healthcheck` is built HERE, alongside the backend, so the binary that
      # ships is the one compiled from src/bin/healthcheck.rs — the source CI
      # lints and unit-tests. Dockerfile.ci used to vendor a second copy inline
      # and compile it in rust:1.97-slim (trixie, glibc 2.41) for a bookworm
      # (glibc 2.36) runtime; this container is bookworm, so the shipped binary
      # is now built against exactly the libc it runs on. See issue #360.
      # It is ~1MB with one transitive dep (ureq, no TLS) and shares this job's
      # dependency graph, so it adds no measurable build time.
      - name: Build release binaries
        working-directory: ./backend-rust
        run: cargo build --release --bin loyalty-backend --bin healthcheck

      # upload-artifact roots the archive at the LEAST COMMON ANCESTOR of the
      # given paths — `backend-rust/target/release/` — so both binaries land
      # FLAT in the artifact and therefore flat in ./backend-binary, which is
      # the Dockerfile.ci build context. Do not add a path outside
      # target/release/ here without re-checking the COPY lines in
      # Dockerfile.ci: a higher ancestor would nest them under directories.
      - name: Upload binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: loyalty-backend-binary
          path: |
            backend-rust/target/release/loyalty-backend
            backend-rust/target/release/healthcheck
          retention-days: 1

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  # =============================================================================
  # BUILD AND PUSH DOCKER IMAGES TO GHCR
  # =============================================================================

  build-and-push:
    name: "Build & Push to GHCR"
    runs-on: ubuntu-latest
    # Only the binary artifact is required; release build runs in parallel
    # with the two test-backend jobs, so build-and-push can start as soon
    # as the binary is ready without waiting for the test suite.
    needs: [build-backend-release]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------------
      # Backend Image (Rust) - uses pre-built binary from build-backend-release
      # -------------------------------------------------------------------------
      # Unpacks BOTH release binaries (loyalty-backend + healthcheck) flat into
      # ./backend-binary, which is the Dockerfile.ci build context below.
      - name: Download backend binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loyalty-backend-binary
          path: ./backend-binary

      # Fail here, with a readable message, rather than 40 lines later inside
      # a BuildKit "COPY failed" trace.
      - name: Assert both binaries are in the build context
        run: |
          set -euo pipefail
          ls -l ./backend-binary
          for bin in loyalty-backend healthcheck; do
            if [ ! -f "./backend-binary/$bin" ]; then
              echo "::error::./backend-binary/$bin is missing — the upload/download artifact layout changed."
              exit 1
            fi
          done

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/backend
          # The immutable commit-SHA tag is what every automated path consumes
          # (deploy-staging, deploy.yml, regression-api, start-app-stack), and
          # it is produced on every event.
          #
          # The mutable branch tag is scoped to the DEFAULT branch. Nothing
          # consumes a `:<branch>` tag off main, so any other branch that ever
          # reaches this job would only leave a permanent GHCR tag behind,
          # silently re-pointed at a different commit each time it built. `main`
          # is unaffected: is_default_branch is true there, so the `:main` tag
          # is still published exactly as before.
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch,enable={{is_default_branch}}

      - name: Build and push backend
        id: build-backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend-binary
          file: ./backend-rust/Dockerfile.ci
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          # Baked into the image as ENV GIT_SHA and surfaced by /api/health as
          # `revision` (issue #345). The image carrying its own SHA is what lets
          # the staging/production verifiers prove a deploy was not a no-op
          # without any SSH access to the host.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,mode=max,scope=backend-ci
          platforms: linux/amd64

      # -------------------------------------------------------------------------
      # ASSERT THE SHIPPED healthcheck BINARY ACTUALLY EXECUTES (issue #360)
      #
      # docker-compose.prod.yml runs /app/healthcheck as the container's Docker
      # HEALTHCHECK, but nothing gated on it — so a binary that could not even
      # be loaded (glibc skew, lost exec bit, wrong architecture) would leave
      # the container sitting `unhealthy` forever while serving traffic
      # normally, with no CI, deploy step or alert saying so.
      #
      # Run it in the JUST-PUSHED image, which is the artifact that ships.
      # Nothing listens on port 4001 in a bare container, so the CORRECT
      # outcome is the binary's own connection-refused message on stderr and
      # exit 1. The check is written so a loader failure can never be mistaken
      # for that refusal: it requires the binary's own output text, which only
      # executing code can produce, in addition to rejecting loader signatures.
      #
      # Addressed by DIGEST, not by tag. The digest is what this step just
      # pushed, on every event type — whereas the SHA tag is computed by
      # docker/metadata-action, which does not necessarily use `github.sha`
      # on `pull_request` events. Pulling the digest can never test a
      # different image than the one built here.
      # -------------------------------------------------------------------------
      - name: Assert shipped healthcheck binary executes
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/backend@${{ steps.build-backend.outputs.digest }}
        run: |
          # errexit must be turned OFF explicitly: GitHub runs `run:` blocks
          # under `bash -e {0}`, so omitting `-e` from the `set` line is not
          # enough. The EXPECTED outcome here is a non-zero exit from
          # `docker run` (nothing listens on 4001 in a bare container), and
          # under errexit the command substitution aborts the step before the
          # exit code can be inspected — silently, with no output. Every
          # failure path below exits explicitly instead.
          set +e
          set -uo pipefail

          if ! docker pull "$IMAGE"; then
            echo "::error::Could not pull the image just pushed ($IMAGE)."
            exit 1
          fi

          OUTPUT=$(docker run --rm "$IMAGE" /app/healthcheck 2>&1)
          CODE=$?

          echo "exit code: ${CODE}"
          echo "--- output ---"
          printf '%s\n' "$OUTPUT"
          echo "--------------"

          # 1. Loader / exec signatures, checked FIRST and unconditionally.
          #    These are what a build/runtime glibc mismatch, a dropped
          #    executable bit, or a wrong-arch binary actually look like.
          if printf '%s' "$OUTPUT" | grep -Eqi 'exec format error|error while loading shared libraries|cannot open shared object|GLIBC_|no such file or directory|permission denied|exec: .*not found'; then
            echo "::error::/app/healthcheck could not be LOADED in the shipped image ($IMAGE). This is a loader failure (glibc skew / exec bit / architecture), not a health result. Output above."
            exit 1
          fi

          # 2. Docker's own "could not start the process" exit codes. 125 =
          #    daemon error, 126 = not executable, 127 = command not found.
          case "$CODE" in
            125|126|127)
              echo "::error::docker run exited $CODE — the container could not execute /app/healthcheck at all (126 = not executable, 127 = not found, 125 = daemon error)."
              exit 1
              ;;
          esac

          # 3. Positive proof the compiled code RAN. Only the binary itself can
          #    emit this line, so no loader/exec failure can satisfy it. Keep in
          #    sync with the eprintln! in backend-rust/src/bin/healthcheck.rs.
          if ! printf '%s' "$OUTPUT" | grep -Eq '^healthcheck: request to http://127\.0\.0\.1:4001/api/health failed:'; then
            echo "::error::/app/healthcheck did not produce its own connection-refused message. Expected 'healthcheck: request to http://127.0.0.1:4001/api/health failed: ...' on stderr from a bare container where nothing listens on 4001."
            exit 1
          fi

          # 4. And it must report failure the way the compose HEALTHCHECK
          #    contract requires: exit 1, not 0 and not something else.
          if [ "$CODE" -ne 1 ]; then
            echo "::error::/app/healthcheck ran but exited $CODE; the contract is exit 1 on an unreachable backend."
            exit 1
          fi

          echo "OK: shipped /app/healthcheck loaded, ran, and refused cleanly (exit 1)."

      # -------------------------------------------------------------------------
      # Frontend Image
      # -------------------------------------------------------------------------
      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}/frontend
          # Same scoping as the backend metadata above: immutable SHA tag
          # always, mutable branch tag only on the default branch.
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://loyalty.saichon.com/api' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

      - name: Summary
        run: |
          echo "## Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend (Rust)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-backend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # PROMOTE `latest` (ONLY after the gate has passed)
  #
  # `latest` used to be published by build-and-push, which needs only
  # build-backend-release — so on every push to main it was re-pointed at a
  # build whose unit tests, integration tests and API regression suite were
  # still running (measured: ~1 minute before the gate finished).
  #
  # That matters because docker-compose.ghcr.yml defaults to
  # `image: .../backend:${IMAGE_TAG:-latest}`. An operator running
  # `docker compose up -d` without IMAGE_TAG — exactly the shape of a hurried
  # rollback — would pull the newest UNTESTED image instead of the last
  # known-good one. Both automated deploy paths use the immutable SHA tag and
  # were never exposed; this closes the human/emergency path.
  #
  # Retag-only: imagetools re-points the manifest at the already-built SHA
  # image, so nothing is rebuilt and `latest` is always byte-identical to a
  # gated SHA image.
  # =============================================================================

  promote-latest:
    name: "Promote latest tag"
    runs-on: ubuntu-latest
    # wait-for-frontend-checks included so `latest` means the same thing the
    # staging deploy means: backend gate AND frontend lint/unit tests green.
    # Without it, `latest` could advance past a commit whose frontend tests
    # failed — precisely the "safe to roll back to" claim it is supposed to carry.
    needs: [build-and-push, test-backend-unit, test-backend-integration, regression-api, wait-for-frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5
    # CRITICAL: never let a cosmetic retag fail the workflow run. deploy.yml,
    # trivy.yml and e2e.yml all gate on this workflow's CONCLUSION, so a
    # transient GHCR 5xx here would block the production deploy, skip the image
    # CVE scan and skip Browser E2E — and deploy.yml's tip-of-main staleness
    # guard means a re-run after main moves cannot recover that deploy. A moving
    # convenience tag must never sit on the production critical path.
    continue-on-error: true
    # Two quick merges both reach this job (main runs are never cancelled), and
    # without a group they can interleave so the slower one lands `latest` on
    # the OLDER commit.
    concurrency:
      group: promote-latest-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the gated SHA images
        env:
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Check BOTH source tags resolve before moving either. Retagging in a
          # bare loop meant a frontend failure left backend:latest on the new
          # commit and frontend:latest on the old one — a split `latest` that an
          # operator pulling both would run as a mismatched pair.
          for img in backend frontend; do
            docker buildx imagetools inspect "${IMAGE_BASE}/${img}:${SHA}" >/dev/null
          done

          failed=0
          for img in backend frontend; do
            echo "Promoting ${img}:${SHA} -> ${img}:latest"
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}/${img}:latest" \
              "${IMAGE_BASE}/${img}:${SHA}" || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::latest promotion failed; backend/frontend may now disagree."
            echo "Re-run this job, or promote manually, before relying on :latest."
            exit 1
          fi

          {
            echo "## Promoted \`latest\`"
            echo ""
            echo "Both images resolve to gated commit \`${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # E2E TESTS (using GHCR images)
  # =============================================================================

  regression-api:
    name: "Regression & Smoke (API)"
    runs-on: ubuntu-latest
    # DEPLOY GATE. Runs the API regression/smoke suite (the Playwright `api`
    # project — *.api.spec.ts) against the freshly built images. These tests
    # use Playwright's request context, NOT a browser, so there is no
    # cdn.playwright.dev browser-download dependency — reliable enough to
    # block deploys. The full browser E2E suite runs separately in e2e.yml,
    # which does NOT gate deployment.
    needs: [build-and-push, test-backend-unit, test-backend-integration]
    timeout-minutes: 15
    # Keyed per ref. A constant group here was repo-global: GitHub allows only
    # ONE pending entry per group, so a third queued run evicted (cancelled) the
    # pending one — randomly killing the deploy gate on unrelated branches. This
    # job needs no shared external resource (postgres/redis are per-runner
    # service containers on runner-local ports), so per-ref is safe.
    concurrency:
      group: regression-api-${{ github.ref }}
      cancel-in-progress: false

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loyalty_e2e
          POSTGRES_PASSWORD: loyalty_e2e_pass
          POSTGRES_DB: loyalty_e2e_db
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies (Playwright)
        # The `api` project uses Playwright's request context only — no
        # browser binaries are downloaded, so this stays off the flaky
        # cdn.playwright.dev path entirely.
        run: npm ci

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull images, start backend+frontend, wait for health, seed users.
      # Shared with e2e.yml via a composite action — this was ~70 lines
      # duplicated verbatim in both workflows, which had already drifted.
      - name: Start app stack
        uses: ./.github/actions/start-app-stack
        with:
          image-tag: ${{ github.sha }}

      - name: Run API regression & smoke suite
        # `api` project only, and exclude the OAuth *validation* specs
        # (oauth-validation.*.api.spec.ts) — those launch a real browser
        # despite living in the api project, which would drag the browserless
        # gate back onto the cdn.playwright.dev path. They run in the
        # browser-capable e2e.yml instead. The browserless OAuth *endpoint*
        # smoke tests in health/auth-session still run here.
        run: npx playwright test --project=api --grep-invert "OAuth (Flow|Security) Validation"
        env:
          BACKEND_URL: http://localhost:4202
          FRONTEND_URL: http://localhost:3201
          # Proves the SHA bake works BEFORE anything is deployed (issue #345).
          # This job runs the image that was just built and pushed for THIS
          # commit, so health.api.spec.ts asserting revision == this SHA is a
          # direct test that the image carries its own identity. The SHA is
          # NOT injected into the container by start-app-stack — doing that
          # would make the test assert its own input instead of the image's
          # baked-in value.
          EXPECTED_REVISION: ${{ github.sha }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: regression-api-report
          path: playwright-report/
          retention-days: 7

      - name: Cleanup containers
        if: always()
        run: |
          docker stop backend frontend 2>/dev/null || true
          docker rm backend frontend 2>/dev/null || true

  # =============================================================================
  # WAIT FOR CI Tests WORKFLOW (frontend jobs) BEFORE STAGING DEPLOY
  #
  # ci-test.yml runs the frontend lint and unit-test jobs for the same commit.
  # We poll the gh API instead of using workflow_run (which adds 30-120s of
  # orchestration latency and has a documented "skipped" race when two
  # upstream workflows complete out of order).
  # =============================================================================

  wait-for-frontend-checks:
    name: "Wait for Frontend Checks"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Poll ci-test.yml for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Polling ci-test.yml for commit $COMMIT_SHA"

          # Poll for up to ~12 minutes (72 attempts x 10s). Fail closed if the
          # frontend checks haven't succeeded by then.
          for attempt in $(seq 1 72); do
            CONCLUSION=$(gh run list -R ${{ github.repository }} \
              --workflow=ci-test.yml --branch=main --commit="$COMMIT_SHA" \
              --json conclusion,status --jq '.[0] | "\(.status):\(.conclusion // "pending")"')

            echo "Attempt $attempt: ci-test.yml = ${CONCLUSION:-no-run-yet}"

            case "$CONCLUSION" in
              completed:success)
                echo "ci-test.yml completed successfully"
                exit 0
                ;;
              completed:failure|completed:cancelled|completed:timed_out|completed:action_required|completed:startup_failure)
                echo "::error::ci-test.yml did not succeed (status=$CONCLUSION) — aborting staging deploy"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "::error::Timed out waiting for ci-test.yml to complete for $COMMIT_SHA"
          exit 1

  # =============================================================================
  # DEPLOY TO STAGING (no approval needed)
  #
  # Inlined here so the deploy starts the moment its prerequisites are green,
  # instead of going through a workflow_run hop that adds 30-120s of latency
  # and can race itself into "skipped" purgatory when two upstream workflows
  # finish in the wrong order.
  #
  # The deploy gate is `regression-api` (the no-browser API regression/smoke
  # suite) plus the backend test jobs and `verify-staging`. Full browser E2E
  # lives in the separate e2e.yml workflow and intentionally does NOT gate
  # deployment — a flaky browser/CDN issue there must never block shipping.
  # =============================================================================

  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    # regression-api IS the deploy gate (see its header comment). It was missing
    # from this list, so it ran in PARALLEL with the deploy instead of before it
    # — staging shipped while the API regression suite was still running, and on
    # run 30143612958 staging deployed even though the gate had been cancelled.
    needs: [test-backend-unit, test-backend-integration, build-and-push, wait-for-frontend-checks, regression-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    # `GHCR_TOKEN` below is this job's GITHUB_TOKEN; the remote shim on evergreen
    # uses it to `docker login` + pull ghcr.io/thehfhotel/loyalty-app/*. Without
    # an explicit grant the job inherits the workflow default (no `packages`
    # scope) and only works because the packages are public today. deploy.yml
    # already declares `packages: read` for the identical purpose — keep the two
    # deploy paths on the same scope so making the packages private breaks
    # neither.
    permissions:
      contents: read
      packages: read
    environment:
      name: development
      url: http://loyalty-dev.saichon.com

    steps:
      - name: Checkout config files
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/evergreen-ssh
            docker-compose.yml
            docker-compose.ghcr.yml
            docker-compose.staging.yml
            nginx/nginx.conf
          sparse-checkout-cone-mode: false

      - name: Set up SSH access to evergreen
        uses: ./.github/actions/evergreen-ssh
        with:
          ssh-key: ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
          host-key: ${{ secrets.EVERGREEN_HOST_KEY }}

      - name: Deploy via SSH to evergreen
        env:
          COMMIT_SHA:           ${{ github.sha }}
          GHCR_USER:            ${{ github.actor }}
          GHCR_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET:           ${{ secrets.DEV_JWT_SECRET }}
          JWT_REFRESH_SECRET:   ${{ secrets.DEV_JWT_REFRESH_SECRET }}
          SESSION_SECRET:       ${{ secrets.DEV_SESSION_SECRET }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL:  ${{ vars.GOOGLE_CALLBACK_URL }}
          LINE_CHANNEL_ID:      ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET:  ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CALLBACK_URL:    ${{ vars.LINE_CALLBACK_URL }}
          FRONTEND_URL:         ${{ vars.FRONTEND_URL }}
          BACKEND_URL:          ${{ vars.BACKEND_URL }}
          POSTGRES_USER:        ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:    ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB:          ${{ secrets.POSTGRES_DB }}
        run: |
          set -euo pipefail
          tar -czf /tmp/deploy.tar.gz \
            docker-compose.yml docker-compose.ghcr.yml docker-compose.staging.yml \
            nginx/nginx.conf

          jq -n \
            --arg commit_sha           "$COMMIT_SHA" \
            --arg deploy_payload_b64   "$(base64 -w0 < /tmp/deploy.tar.gz)" \
            --arg ghcr_user            "$GHCR_USER" \
            --arg ghcr_token           "$GHCR_TOKEN" \
            --arg JWT_SECRET           "$JWT_SECRET" \
            --arg JWT_REFRESH_SECRET   "$JWT_REFRESH_SECRET" \
            --arg SESSION_SECRET       "$SESSION_SECRET" \
            --arg GOOGLE_CLIENT_ID     "$GOOGLE_CLIENT_ID" \
            --arg GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET" \
            --arg GOOGLE_CALLBACK_URL  "$GOOGLE_CALLBACK_URL" \
            --arg LINE_CHANNEL_ID      "$LINE_CHANNEL_ID" \
            --arg LINE_CHANNEL_SECRET  "$LINE_CHANNEL_SECRET" \
            --arg LINE_CALLBACK_URL    "$LINE_CALLBACK_URL" \
            --arg FRONTEND_URL         "$FRONTEND_URL" \
            --arg BACKEND_URL          "$BACKEND_URL" \
            --arg POSTGRES_USER        "$POSTGRES_USER" \
            --arg POSTGRES_PASSWORD    "$POSTGRES_PASSWORD" \
            --arg POSTGRES_DB          "$POSTGRES_DB" \
            '{
              commit_sha: $commit_sha,
              deploy_payload_b64: $deploy_payload_b64,
              ghcr: { user: $ghcr_user, token: $ghcr_token },
              env: {
                RUST_ENV:             "staging",
                NODE_ENV:             "staging",
                RUST_LOG:             "info",
                LOG_LEVEL:            "info",
                JWT_SECRET:           $JWT_SECRET,
                JWT_REFRESH_SECRET:   $JWT_REFRESH_SECRET,
                SESSION_SECRET:       $SESSION_SECRET,
                POSTGRES_USER:        $POSTGRES_USER,
                POSTGRES_PASSWORD:    $POSTGRES_PASSWORD,
                POSTGRES_DB:          $POSTGRES_DB,
                DATABASE_URL:         ("postgresql://" + $POSTGRES_USER + ":" + $POSTGRES_PASSWORD + "@postgres:5432/" + $POSTGRES_DB),
                REDIS_URL:            "redis://redis:6379",
                FRONTEND_URL:         $FRONTEND_URL,
                BACKEND_URL:          $BACKEND_URL,
                GOOGLE_CLIENT_ID:     $GOOGLE_CLIENT_ID,
                GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET,
                GOOGLE_CALLBACK_URL:  $GOOGLE_CALLBACK_URL,
                LINE_CHANNEL_ID:      $LINE_CHANNEL_ID,
                LINE_CHANNEL_SECRET:  $LINE_CHANNEL_SECRET,
                LINE_CALLBACK_URL:    $LINE_CALLBACK_URL
              }
            }' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              deploy@evergreen.thehfhotel.org

  # =============================================================================
  # VERIFY STAGING HEALTH + REVISION
  #
  # Catches deploy-itself-broken cases (image won't start, migration crashes
  # at runtime, env var missing) that pre-merge tests can't see, AND the
  # deploy-was-a-no-op case. Two assertions:
  #
  #   1. staging /api/health answers 200 — twice in a row, because a container
  #      that binds the port and then crashes satisfies a single-shot check;
  #   2. the app reports THIS commit as its `revision`.
  #
  # (2) matters because /api/health's `version` field is CARGO_PKG_VERSION — a
  # hard-coded value identical on every commit — so a 200 proves only that
  # *something* answers. This job's green is what deploy.yml's
  # check-prerequisites reads to authorise the now-UNATTENDED production
  # deploy, so "staging silently stayed on the old build" must not read as
  # verified.
  #
  # `revision` is baked into the image at build time (ARG/ENV GIT_SHA in
  # Dockerfile.ci, build-arg set in build-and-push) — NOT injected by the
  # deploy host. That is deliberate: the remote shim on evergreen cannot be
  # edited from this repo, and the deploy key carries a forced command, so
  # neither `ssh ... docker inspect` nor a shim change was available. An image
  # that carries its own SHA needs neither.
  #
  # The matching environment URL is set on `deploy-staging` above.
  # =============================================================================

  verify-staging:
    name: "Verify Staging"
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    # This job now needs NO secrets: both checks are plain HTTPS against the
    # staging URL. `environment:` is kept only so the deployment shows up
    # against the development environment in the GitHub UI.
    environment:
      name: development
      url: http://loyalty-dev.saichon.com

    steps:
      - name: Poll staging /api/health
        id: poll
        env:
          STAGING_HEALTH_URL: http://loyalty-dev.saichon.com/api/health
        run: |
          set -euo pipefail
          # Require two CONSECUTIVE successes: the old single-shot exit passed
          # for a backend that answered once and then crash-looped. Same 90s
          # total budget, so this costs at most one extra 3s tick.
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$STAGING_HEALTH_URL" >/dev/null; then
              ok=$((ok + 1))
              if [ "$ok" -ge 2 ]; then
                echo "Staging healthy (2 consecutive checks) after ${attempt} attempts"
                exit 0
              fi
            else
              ok=0
            fi
            sleep 3
          done
          echo "::error::Staging /api/health not responding after 90s"
          exit 1

      # ---------------------------------------------------------------------
      # ASSERT STAGING IS RUNNING THIS COMMIT (issue #345)
      #
      # PHASED ROLLOUT — three outcomes, on purpose:
      #   revision == this SHA        -> pass (the deploy really landed)
      #   revision absent / "unknown" -> WARN but pass. Images built before
      #                                  the GIT_SHA bake existed, and any
      #                                  rollback to one, legitimately cannot
      #                                  answer. Failing on those would turn
      #                                  a rollback into a red deploy at the
      #                                  worst possible moment.
      #   revision == a DIFFERENT SHA -> FAIL. This is the genuine signal the
      #                                  audit asked for: staging answered,
      #                                  but from another build — a no-op,
      #                                  partial, or overtaken deploy.
      #
      # Once no pre-bake image can be rolled back to, the warn branch should
      # become a failure.
      # ---------------------------------------------------------------------
      - name: Assert staging is running this commit
        env:
          STAGING_HEALTH_URL: http://loyalty-dev.saichon.com/api/health
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Poll until it MATCHES rather than classifying the first sample:
          # for a few seconds after a deploy the outgoing container can still
          # be answering through nginx while the new one starts, and reading
          # that as "serving a different commit" would fail a perfectly good
          # deploy. Only a revision that never becomes this SHA is a finding.
          #
          # Deliberately NOT `curl -f`: /api/health answers 503 when a
          # dependency is degraded, and -f discards the body on a 4xx/5xx —
          # which is exactly the body carrying `revision`. A degraded staging
          # still tells us WHICH BUILD is degraded, and that is the question
          # this step exists to answer.
          REVISION=""
          for attempt in $(seq 1 20); do
            BODY=$(curl -sS --max-time 5 "$STAGING_HEALTH_URL" 2>/dev/null || true)
            REVISION=$(printf '%s' "$BODY" | jq -r '.revision // empty' 2>/dev/null || true)
            if [ "$REVISION" = "$EXPECTED_SHA" ]; then
              echo "Staging is running $EXPECTED_SHA (after ${attempt} attempt(s))."
              exit 0
            fi
            sleep 3
          done

          echo "expected revision:  $EXPECTED_SHA"
          echo "last seen revision: ${REVISION:-<absent>}"

          if [ -z "$REVISION" ] || [ "$REVISION" = "unknown" ]; then
            echo "::warning::Staging /api/health reports no revision (${REVISION:-absent}). The running image predates the GIT_SHA bake, or this is a rollback to such an image. Cannot prove the deploy landed — NOT failing the deploy for it."
            {
              echo "## Verify Staging: revision unavailable"
              echo ""
              echo "- Expected: \`$EXPECTED_SHA\`"
              echo "- Reported: \`${REVISION:-absent}\`"
              echo ""
              echo "The running image was built before \`GIT_SHA\` was baked in."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Staging is serving a DIFFERENT commit. Expected $EXPECTED_SHA, got $REVISION. The deploy was a no-op, partial, or has been overtaken — staging must NOT be treated as verified for this commit."
          exit 1

  # =============================================================================
  # NOTIFY ON STAGING HEALTHCHECK FAILURE
  #
  # Files (or comments on) a GitHub issue when the verify-staging poll fails
  # so the failure is visible somewhere a human actually reads, not just the
  # red X in the Actions tab. The cargo-audit workflow uses the same pattern;
  # see `cargo-audit.yml`. Slack / email channels can be added later via an
  # OPS_ALERT_SLACK_WEBHOOK secret without touching the verify job.
  # =============================================================================

  notify-verify-staging-failure:
    name: "Notify on Verify Staging failure"
    runs-on: ubuntu-latest
    needs: [verify-staging]
    # A bare `failure()` in a job-level `if` is true when ANY job in the needs
    # ANCESTRY failed — here that is the whole pipeline (lint-backend, both test
    # jobs, build-and-push, wait-for-frontend-checks, deploy-staging). So a
    # clippy failure on main, which skips deploy-staging and verify-staging
    # entirely, still filed an issue asserting staging had been deployed and was
    # unhealthy. Nothing had been deployed; and since this job comments on the
    # same open issue every time, a persistently red lint turned it into noise
    # that gets muted — hiding the real failures it exists to catch. Check the
    # one job this notifier is about, explicitly.
    if: always() && needs.verify-staging.result == 'failure' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: File or update verify-staging-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Verify Staging failed on main"
          EXISTING=$(gh issue list -R "${{ github.repository }}" \
            --search "$TITLE in:title is:open" \
            --json number --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          The post-deploy \`Verify Staging\` step failed after a push to \`main\`.

          - Run: $RUN_URL
          - Commit: \`${{ github.sha }}\`
          - Author: @${{ github.actor }}

          The deploy ran, but staging did not verify. \`Verify Staging\` has two
          checks and the run log says which one failed:
          - \`/api/health\` never answered 200 twice in a row → the new image is
            up but not serving (crash loop, bad migration, missing env var).
          - \`/api/health\` reported a \`revision\` that is a DIFFERENT commit →
            the deploy was a no-op, partial, or overtaken; staging is still on
            an older build and must NOT be treated as verified. (An absent or
            \`unknown\` revision only warns — it means the running image
            predates the SHA bake.)

          Investigate:
          1. Open the run log linked above to see which check failed.
          2. Ask staging what it thinks it is running:
             \`curl -sS http://loyalty-dev.saichon.com/api/health | jq '{status, revision, services}'\`
             (no \`-f\` — a degraded backend answers 503 and the body is the
             part you need).
          3. Roll back via \`docs/rollback-runbook.md\` if root cause is not
             a quick fix.

          There is deliberately NO log artifact attached. The steps that used to
          SSH to evergreen for \`docker logs\` could never work — the deploy key
          carries a forced command, so client-supplied commands are ignored —
          and a silently empty artifact is worse than none. Host logs need a
          human session on evergreen.
          EOF
          )

          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" -R "${{ github.repository }}" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create -R "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY"
            echo "Filed new verify-staging-failure issue"
          fi

# Production docker-compose override
# Used for production deployments via GitHub Actions
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# SECURITY: All secrets injected from GitHub Secrets via workflow
# GitHub Actions workflow sets environment variables in .env file
# This file does NOT hardcode any secrets - all loaded from .env at runtime

#
# Resource limits (see Operational HIGH-2):
#
# `docker compose` (non-swarm) honours the top-level `mem_limit:` and
# `cpus:` keys, NOT `deploy.resources.limits` (which is swarm-only and
# silently ignored here). The starting numbers below are conservative
# anchors for a single-host evergreen deploy — tune from `docker stats`
# under real traffic once production has a few weeks of usage.
#
# Floor reasoning:
# - backend:  1 CPU / 512 MiB   — Rust binary, small steady state; spikes
#                                 on multipart slip uploads.
# - frontend: 0.5 CPU / 128 MiB — nginx serving static SPA bundle.
# - postgres: 2 CPU / 2 GiB     — primary memory pressure source under
#                                 audit-log growth; largest allocation.
# - redis:    0.5 CPU / 256 MiB — small cache, currently single-instance.
# - nginx:    0.25 CPU / 64 MiB — reverse proxy, no heavy lifting.
#

services:
  postgres:
    container_name: loyalty_postgres_production
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    ports:
      # Bind to localhost only — backend reaches postgres via the docker network.
      # Host port mapping exists for ad-hoc DBA access from the host (via SSH tunnel).
      - "127.0.0.1:5434:5432"  # Production PostgreSQL port

  redis:
    container_name: loyalty_redis_production
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    ports:
      # Bind to localhost only — backend reaches redis via the docker network.
      - "127.0.0.1:6379:6379"  # Production Redis port

  backend:
    container_name: loyalty_backend_production
    cpus: 1.0
    mem_limit: 512m
    # Publish the backend on the host loopback ONLY so the host-network
    # host-metrics-pusher can scrape /metrics (axum-prometheus) for the
    # hf-analytics dashboard. 127.0.0.1-bound — never publicly exposed; nginx
    # stays the sole public entry. Note: this reaches the full backend API
    # from the evergreen host's loopback (app JWT auth + rate-limiting still
    # apply); /metrics carries no secrets.
    ports:
      - "127.0.0.1:4011:4001"
    build:
      target: runner  # Use production-optimized runner stage with Rust binary
    environment:
      # Environment variables are loaded from .env file created by GitHub Actions
      # The workflow injects secrets from GitHub Secrets into .env
      # Non-sensitive defaults only (all secrets come from .env)

      RUST_ENV: ${RUST_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-4001}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Secrets (loaded from .env created by GitHub Actions)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}

      # Database & Redis
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # URLs
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}

      # OAuth Secrets
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      LINE_CLIENT_ID: ${LINE_CHANNEL_ID}
      LINE_CLIENT_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CALLBACK_URL: ${LINE_CALLBACK_URL}

      # Admin bootstrap allowlist (issue #348): one-time first-admin
      # provisioning. NOT in the GitHub-Actions .env payload — added by hand
      # to the server-side .env for the bootstrap window, then removed (the
      # next deploy rewrites .env without it anyway). Empty/unset = feature
      # off; the backend logs a startup warning while it is set in production.
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}

      # Email Service (SMTP/IMAP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # From address for outgoing mail. Falls back to SMTP_USER when unset,
      # and must be an address the mailbox genuinely OWNS (issue #352).
      SMTP_FROM: ${SMTP_FROM:-}
      # Property mailboxes that get one short email per new booking and per
      # verified deposit (B0). Blank = off for that property; the backend
      # reads a blank as "unset" so `${VAR:-}` cannot mean "send to nobody".
      BOOKING_NOTIFY_EMAIL_HF: ${BOOKING_NOTIFY_EMAIL_HF:-}
      BOOKING_NOTIFY_EMAIL_HFVILLE: ${BOOKING_NOTIFY_EMAIL_HFVILLE:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      # SlipOK slip verification + PromptPay receiving ids (PR #399 / #402).
      # Optional; the backend treats a blank as unset (config::env_present).
      SLIPOK_API_KEY: ${SLIPOK_API_KEY:-}
      SLIPOK_BRANCH_ID: ${SLIPOK_BRANCH_ID:-}
      SLIPOK_AUTO_VERIFY: ${SLIPOK_AUTO_VERIFY:-}
      PROMPTPAY_TAX_ID: ${PROMPTPAY_TAX_ID:-}
      PROMPTPAY_HF_ID: ${PROMPTPAY_HF_ID:-}
      PROMPTPAY_HFVILLE_ID: ${PROMPTPAY_HFVILLE_ID:-}
      # Slip-image retention (F2). Days after a booking closes before the
      # slip photograph is erased from STORAGE_PATH/slips. Blank = OFF: the
      # backend reads a blank as unset (config::env_present), and there is
      # deliberately no default, because the window is the owner's decision.
      SLIP_RETENTION_DAYS: ${SLIP_RETENTION_DAYS:-}
    volumes:
      # Remove development volume mounts for production
      - backend_logs:/app/logs
      - backend_storage:/app/storage
    # Use Dockerfile CMD (/app/loyalty-backend) - no override needed
    # The runner image is Distroless (gcr.io/distroless/cc-debian12) — no
    # shell, no curl. /app/healthcheck is a tiny Rust binary shipped in
    # the image (src/bin/healthcheck.rs) that hits /api/health locally
    # and exits 0 on a 2xx response.
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    container_name: loyalty_frontend_production
    # NOTE: VITE_API_URL is build-time only (baked into the image during docker build).
    # NODE_ENV is not consumed by the alpine nginx serving the built SPA.
    # Neither belongs in runtime env for the GHCR frontend image.
    cpus: 0.5
    mem_limit: 128m
    volumes:
      # GHCR frontend uses nginx:alpine with logs at /var/log/nginx
      - frontend_logs:/var/log/nginx
    # Command is set in docker-compose.ghcr.yml for GHCR deployments
    # For local builds without GHCR, use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    restart: unless-stopped

  nginx:
    container_name: loyalty_nginx_production
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    ports:
      - "4001:80"  # Production Nginx port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx

# Add production-specific volumes
volumes:
  backend_logs:
  backend_storage:
  frontend_logs:
  nginx_logs:
